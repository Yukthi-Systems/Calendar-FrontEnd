<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>MS25 Calendar &amp; Tasks</title>
    <meta name="description" content="Plan, share and track your calendar and tasks together." />
    <meta name="theme-color" content="#4338ca" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <!-- Link-preview card when this page's URL is shared (Slack, WhatsApp, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MS25 Calendar & Tasks" />
    <meta property="og:description" content="Plan, share and track your calendar and tasks together." />
    <meta property="og:image" content="/favicon.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="MS25 Calendar & Tasks" />
    <meta name="twitter:description" content="Plan, share and track your calendar and tasks together." />
    <meta name="twitter:image" content="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
    <!-- Runtime config written by env.sh at container start (see Dockerfile) -->
    <script src="/env-config.js"></script>
    <style>
      html,
      body,
      #app-root {
        height: 100%;
        margin: 0;
        padding: 0;
      }
      html {
        overscroll-behavior: none;
      }
      body {
        height: 100vh;
        height: 100dvh; /* mobile browsers: don't let the URL bar hide the bottom */
        overflow: hidden; /* react-native-web owns scrolling inside the app */
      }
      #app-root {
        /* react-native-web's root view is `flex: 1`, which only fills a flex parent —
           without this every screen collapses to its content height. */
        display: flex;
      }
    </style>
  </head>
  <body>
    <div id="app-root"></div>
  </body>
</html>
